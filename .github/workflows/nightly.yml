name: nightly

# Live-model evaluations and smoke tests. Budget-capped; never runs on PRs.
# Phase 1 adds the recorded quickstart live run; Phase 2 adds the reference eval.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    if: github.repository == 'hawser-ai/hawser'
    env:
      HAWSER_RECORD_MODE: live
      HAWSER_LIVE_BUDGET_USD: "2.00"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - name: Live tests (placeholder until Phase 1)
        run: uv run pytest -m live || echo "no live tests yet"
