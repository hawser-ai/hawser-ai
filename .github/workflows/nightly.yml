name: nightly

# Live-model smoke test and evaluation. Budget-capped; never runs on PRs or forks.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    if: github.repository == 'hawser-ai/hawser-ai'
    env:
      HAWSER_RECORD_MODE: live
      HAWSER_LIVE_BUDGET_USD: "2.00"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - name: Live quickstart (real model call)
        run: |
          mkdir /tmp/nightly && cd /tmp/nightly
          uv run --project "$GITHUB_WORKSPACE" hawser init
          uv run --project "$GITHUB_WORKSPACE" hawser quickstart --live --json > out.json
          grep -q '"status": *"accepted"' out.json || { cat out.json; exit 1; }
