[project]
name = "hawser-evals"
version = "0.1.0a0"
description = "Evaluation engine and metrics for Hawser skills."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["hawser", "pyyaml>=6.0", "pydantic>=2.9,<3"]

[tool.uv.sources]
hawser = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hawser_evals"]
