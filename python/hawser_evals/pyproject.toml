[project]
name = "hawser-evals"
version = "0.1.0"
description = "Evaluation engine and metrics for Hawser skills."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["evaluation", "llm", "benchmark", "document-ai"]
authors = [{ name = "Hawser contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["hawser-ai>=0.1.0,<0.2", "pyyaml>=6.0", "pydantic>=2.9,<3"]

[tool.uv.sources]
hawser-ai = { workspace = true }

[project.urls]
Homepage = "https://github.com/hawser-ai/hawser"
Documentation = "https://github.com/hawser-ai/hawser/tree/main/docs"
Source = "https://github.com/hawser-ai/hawser"
Issues = "https://github.com/hawser-ai/hawser/issues"
Changelog = "https://github.com/hawser-ai/hawser/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hawser_evals"]
