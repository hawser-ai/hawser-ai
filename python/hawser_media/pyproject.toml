[project]
name = "hawser-media"
version = "0.1.0"
description = "Document and image primitives for Hawser: PDF text with boxes, rendering, OCR, image operations and layout."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["pdf", "ocr", "image", "document", "layout"]
authors = [{ name = "Hawser contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9,<3",
  "pypdfium2>=4.30",
  "pillow>=10.4",
  "filetype>=1.2",
  "numpy>=1.26",
  "httpx>=0.27",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.4"]

[project.urls]
Homepage = "https://github.com/hawser-ai/hawser-ai"
Documentation = "https://github.com/hawser-ai/hawser-ai/tree/main/docs"
Source = "https://github.com/hawser-ai/hawser-ai"
Issues = "https://github.com/hawser-ai/hawser-ai/issues"
Changelog = "https://github.com/hawser-ai/hawser-ai/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hawser_media"]
