[project]
name = "hawser-server"
version = "0.1.0a0"
description = "Hawser control plane: hawserd (API, durable worker, migrations)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "hawser",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pg8000>=1.31",
  "boto3>=1.35",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.scripts]
hawserd = "hawser_server.cli:app"

[tool.uv.sources]
hawser = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hawser_server"]
