[project]
name = "hawser-server"
version = "0.1.0"
description = "Hawser control plane: hawserd (API, durable worker, migrations)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["ai", "workflow", "server", "fastapi", "durable-execution"]
authors = [{ name = "Hawser contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "hawser-ai>=0.1.0,<0.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pg8000>=1.31",
  "boto3>=1.35",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.scripts]
hawserd = "hawser_server.cli:app"

[tool.uv.sources]
hawser-ai = { workspace = true }

[project.urls]
Homepage = "https://github.com/hawser-ai/hawser-ai"
Documentation = "https://github.com/hawser-ai/hawser-ai/tree/main/docs"
Source = "https://github.com/hawser-ai/hawser-ai"
Issues = "https://github.com/hawser-ai/hawser-ai/issues"
Changelog = "https://github.com/hawser-ai/hawser-ai/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hawser_server"]
# The built web app is gitignored in the source tree; `make web` puts it here before a build.
artifacts = ["src/hawser_server/static/**"]
