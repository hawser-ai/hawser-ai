# Model registry. Pricing is USD per million tokens (first-party API rates, cached 2026-10-06).
# `hawser models check <id>` verifies an entry with one cheap live call.
version: "2026-10-18"
models:
  - id: anthropic/claude-opus-5-5
    provider: anthropic
    model: claude-opus-5-5
    display_name: Claude Opus 5.5
    modalities: [text, image, document]
    context_window: 1000000
    max_output_tokens: 128000
    structured_output: true
    tool_calling: true
    streaming: true
    data_handling: { hosted: true, regions: [us], retains_data: false, trains_on_data: false }
    pricing: { input_per_mtok: 4.0, output_per_mtok: 20.0, cache_read_per_mtok: 0.20, version: "2026-10-06" }
    quality_prior: 0.9
    speed_prior: 0.3
  - id: anthropic/claude-sonnet-5-5
    provider: anthropic
    model: claude-sonnet-5-5
    display_name: Claude Sonnet 5.5
