[project]
name = "hawser-ai"
version = "0.1.0"
description = "Hawser: an open-source runtime for verifiable multimodal AI workflows."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["ai", "llm", "vlm", "document-ai", "ocr", "extraction", "evidence", "workflow", "agents"]
authors = [{ name = "Hawser contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9,<3",
  "python-ulid>=3.0",
  "hawser-media>=0.1.0,<0.2",
  "anthropic>=1.0",
  "rapidfuzz>=3.9",
  "jsonschema>=4.23",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
ocr = ["hawser-media[ocr]>=0.1.0,<0.2"]

[project.scripts]
hawser = "hawser.cli:app"

[tool.uv.sources]
hawser-media = { workspace = true }

[project.urls]
Homepage = "https://github.com/hawser-ai/hawser-ai"
Documentation = "https://github.com/hawser-ai/hawser-ai/tree/main/docs"
Source = "https://github.com/hawser-ai/hawser-ai"
Issues = "https://github.com/hawser-ai/hawser-ai/issues"
Changelog = "https://github.com/hawser-ai/hawser-ai/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hawser"]
