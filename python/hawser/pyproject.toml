[project]
name = "hawser-ai"
version = "0.1.1"
description = "Hawser: an open-source runtime for verifiable multimodal AI workflows."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["ai", "llm", "vlm", "document-ai", "ocr", "extraction", "evidence", "workflow", "agents"]
authors = [{ name = "Hawser contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9,<3",
  "python-ulid>=3.0",
  "anthropic>=1.0",
  "rapidfuzz>=3.9",
  "jsonschema>=4.23",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  # media (hawser_media): PDF text and rendering, images
  "pypdfium2>=4.30",
  "pillow>=10.4",
  "filetype>=1.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Local OCR for scans and photos (RapidOCR). On Linux, OpenCV also needs the libgl1 package.
ocr = ["rapidocr-onnxruntime>=1.4"]

[project.scripts]
hawser = "hawser.cli:app"

[project.urls]
Homepage = "https://github.com/hawser-ai/hawser-ai"
Documentation = "https://github.com/hawser-ai/hawser-ai/tree/main/docs"
Source = "https://github.com/hawser-ai/hawser-ai"
Issues = "https://github.com/hawser-ai/hawser-ai/issues"
Changelog = "https://github.com/hawser-ai/hawser-ai/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One distribution, three import packages: the SDK/runtime/CLI, media primitives and evaluations.
packages = ["src/hawser", "src/hawser_media", "src/hawser_evals"]
