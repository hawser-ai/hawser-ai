[project]
name = "hawser"
version = "0.1.0a0"
description = "Hawser: an open-source runtime for verifiable multimodal AI workflows."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "python-ulid>=3.0",
  "hawser-media",
  "anthropic>=1.0",
  "rapidfuzz>=3.9",
  "jsonschema>=4.23",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.scripts]
hawser = "hawser.cli:app"

[project.urls]
Documentation = "https://github.com/hawser-ai/hawser/tree/main/docs"

[tool.uv.sources]
hawser-media = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hawser"]
