[project]
name = "hawser-synth"
version = "0.1.0a0"
description = "Synthetic document generators for Hawser examples, fixtures and evaluation datasets."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "hawser",
  "reportlab>=4.2",
  "pypdfium2>=4.30",
  "pillow>=10.4",
]

[tool.uv.sources]
hawser = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hawser_synth"]
