# Hawser self-hosted stack (Phase 5): Postgres, RustFS (S3-compatible), hawserd API, durable worker.
#   make up           # from the repository root
#   hawser init --server http://localhost:8080 && export HAWSER_API_KEY=<printed key>
#
# Secrets below are development defaults. Override them with a .env file next to this
# compose file (HAWSER_DEV_API_KEY, POSTGRES_PASSWORD, S3_SECRET_KEY) before exposing
# the stack beyond localhost.

name: hawser

x-hawserd-env: &hawserd-env
  HAWSERD_DATABASE_URL: postgresql://hawser:${POSTGRES_PASSWORD:-hawser}@postgres:5432/hawser
  HAWSERD_S3_BUCKET: hawser
  HAWSERD_S3_ENDPOINT_URL: http://s3:9000
  HAWSERD_S3_REGION: us-east-1
  HAWSERD_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-hawser}
  HAWSERD_S3_SECRET_KEY: ${S3_SECRET_KEY:-hawser-s3-dev-secret}
  HAWSERD_PUBLIC_URL: ${HAWSER_PUBLIC_URL:-http://localhost:8080}
  HAWSERD_DEV_API_KEY: ${HAWSER_DEV_API_KEY:-hk_live_compose-dev-key-change-me-0000000000}
  HAWSERD_LEASE_SECONDS: ${HAWSERD_LEASE_SECONDS:-60}
  HAWSERD_WORKER_CONCURRENCY: "2"
  # Model providers: pass through from the host environment.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  HAWSER_DEFAULT_MODEL: ${HAWSER_DEFAULT_MODEL:-anthropic/claude-opus-5-5}
  HAWSER_RECORD_MODE: ${HAWSER_RECORD_MODE:-live}
  # Replay a recording instead of calling a provider (demos, conformance): e.g.
  # HAWSER_RECORD_MODE=replay HAWSER_CASSETTE_DIR=/app/python/hawser/src/hawser/_quickstart/cassette
  HAWSER_CASSETTE_DIR: ${HAWSER_CASSETTE_DIR:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hawser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hawser}
      POSTGRES_DB: hawser
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hawser -d hawser"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # RustFS: Apache-2.0, S3-compatible, MinIO-style configuration. Console on :9001.
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-hawser}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-hawser-s3-dev-secret}
      RUSTFS_VOLUMES: /data
    ports:
      - "9001:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health || curl -sf http://127.0.0.1:9000/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  hawserd:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: hawser/hawserd:local
    command: ["serve", "--migrate"]
    environment:
      <<: *hawserd-env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    volumes:
      - ../../skills:/app/skills:ro

  worker:
    image: hawser/hawserd:local
    command: ["worker"]
    environment:
      <<: *hawserd-env
    depends_on:
      hawserd:
        condition: service_started
    volumes:
      - ../../skills:/app/skills:ro
    deploy:
      replicas: 1

volumes:
  postgres-data:
  s3-data:
